name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install harness + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Validate arena specs / datasets / mock scripts
        run: python -m arena validate
      - name: Unit tests (offline)
        run: pytest -q

  comparison:
    # The only job that installs every adapter, so it carries everything that
    # needs the real libraries rather than the stdlib baseline alone:
    #
    #   contract   — the wire-level adapter checks. These caught the hard-coded
    #     prompt and iteration-budget bugs, and until now CI ran them against
    #     `vanilla` only, because the dev extra pulls no framework. This is a
    #     hard gate.
    #   resilience — the faults are scripted and byte-identical for everyone, so
    #     any difference in outcome is the framework's own error handling.
    #     Report-only; fails only if the stdlib baseline stops recovering, which
    #     would mean the arena is broken.
    #   delegation — the same 10 items run as one agent and as a three-role
    #     pipeline, hand-rolled and in a graph library, which separates the cost
    #     of the structure from the cost of the framework. Report-only.
    #   overhead   — every framework gets the same prompt and the same two tool
    #     definitions and the mock replays identical turns, so the prompt size
    #     each one puts on the wire is its own serialisation cost. Report-only;
    #     fails only if the baseline is missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install harness + every verified adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          for fw in langgraph pydantic_ai openai_agents microsoft_af smolagents; do
            python -m pip install -r "frameworks/$fw/requirements.txt"
          done
      - name: Wire-level adapter contract (the only job where every adapter is installed)
        # `pip install -e '.[dev]'` deliberately pulls no framework, so lint-and-test
        # can only contract-test `vanilla`. These are the checks that caught the
        # hard-coded-prompt and iteration-budget bugs, so they need to run against
        # the real libraries. ARENA_EXPECT_FRAMEWORKS makes a broken install fail
        # loudly rather than quietly shrinking the matrix back to one adapter.
        env:
          ARENA_EXPECT_FRAMEWORKS: vanilla,langgraph,pydantic_ai,openai_agents,microsoft_af,smolagents
        run: pytest tests/test_adapters_contract.py -q
      - name: Run the resilience arena
        run: python -m arena run --arena resilience --framework all --mode mock --no-scorecard
      - name: Report recovery, and fail only if the baseline broke
        run: python .github/scripts/check_resilience.py
      - name: Run tool_use for the overhead comparison
        run: python -m arena run --arena tool_use --framework all --mode mock --no-scorecard
      - name: Report per-framework prompt overhead
        run: python .github/scripts/report_overhead.py tool_use
      - name: Which frameworks can pause, and which can survive a crash
        # Adapters without a `resume` method report themselves unsupported here
        # rather than failing items, so this step is a capability census, not a
        # gate. It turns red only if the run itself breaks.
        run: python -m arena run --arena human_in_the_loop --framework all --mode mock --no-scorecard
      - name: What a three-role pipeline costs against one agent
        # Report-only. The pipelines are *expected* to cost more - that is the
        # measurement. Fails only if a pairing is missing or an entry reports zero.
        run: |
          python -m arena run --arena multi_agent --framework all --mode mock --no-scorecard
          python .github/scripts/report_delegation.py
      - name: Run the remaining arenas so the summary is complete
        run: |
          for a in structured_output rag durable_state; do
            python -m arena run --arena "$a" --framework all --mode mock --no-scorecard
          done
      - name: Cross-arena summary
        run: python -m arena summary --print
      - uses: actions/upload-artifact@v7
        with:
          name: cross-arena-summary
          path: runs/summary.md

  mock-smoke:
    # Proves a real framework adapter wires together against the mock LLM.
    # Only frameworks whose adapter has been verified against the mock belong here.
    # crewai is intentionally NOT included yet: its adapter is written but not yet
    # smoke-verified (see STATUS.md / frameworks/crewai/README.md). Add a job for it
    # once it passes locally on Python 3.12. claude_agent_sdk is a deliberate stub
    # (see frameworks/claude_agent_sdk/README.md).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.13", framework: langgraph, arena: tool_use }
          - { python-version: "3.13", framework: langgraph, arena: structured_output }
          - { python-version: "3.13", framework: pydantic_ai, arena: tool_use }
          - { python-version: "3.13", framework: pydantic_ai, arena: structured_output }
          - { python-version: "3.13", framework: openai_agents, arena: tool_use }
          - { python-version: "3.13", framework: microsoft_af, arena: tool_use }
          - { python-version: "3.13", framework: langgraph, arena: multi_agent }
          - { python-version: "3.13", framework: pydantic_ai, arena: multi_agent }
          - { python-version: "3.13", framework: openai_agents, arena: multi_agent }
          - { python-version: "3.13", framework: langgraph, arena: rag }
          - { python-version: "3.13", framework: pydantic_ai, arena: rag }
          - { python-version: "3.13", framework: microsoft_af, arena: rag }
          - { python-version: "3.13", framework: smolagents, arena: tool_use }
          - { python-version: "3.13", framework: smolagents, arena: rag }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install harness + ${{ matrix.framework }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r frameworks/${{ matrix.framework }}/requirements.txt
      - name: Run ${{ matrix.framework }} on ${{ matrix.arena }} against the mock LLM
        run: |
          python -m arena run --arena ${{ matrix.arena }} --framework ${{ matrix.framework }} --mode mock
      - name: Fail if the adapter was not actually exercised
        env:
          ARENA: ${{ matrix.arena }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          arena = os.environ["ARENA"]
          runs = sorted(pathlib.Path("runs").glob(f"*__{arena}__mock.json"))
          rec = json.loads(runs[-1].read_text())
          fw = rec["frameworks"][0]
          assert fw["available"], fw.get("reason")
          passed = sum(1 for it in fw["items"] if it["passed"])
          print(f"{fw['framework']} / {arena}: {passed}/{len(fw['items'])} passed in mock mode")
          assert passed == rec["dataset_size"], "mock smoke run must be fully green"
          PY
