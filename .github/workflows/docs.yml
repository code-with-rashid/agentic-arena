name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      # --strict: a broken internal link or a page missing from the nav fails the
      # build. Links that leave the docs tree are rewritten to github.com by
      # docs/hooks/fix_links.py before this runs.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publishes the built site to GitHub Pages. Opt-in so `main` stays green
    # until the repo owner is ready: enable Pages once (Settings -> Pages ->
    # Source: GitHub Actions) AND add a repo variable PAGES_ENABLED=true
    # (Settings -> Secrets and variables -> Actions -> Variables). Until both are
    # set this job is skipped and only `build` runs.
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
