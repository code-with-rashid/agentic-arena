id = "resilience"
description = "The model misbehaves on purpose — malformed tool arguments, a tool that does not exist, a tool call that errors — and the agent must recover and still answer correctly. Measures how a framework degrades when the model does something unreasonable, which is the failure mode real deployments actually hit."
tools = ["search", "calculator"]

system_prompt_intent = """
You are a careful assistant with two tools: `search` (a small factual knowledge base)
and `calculator` (basic arithmetic). Use `search` for any fact you are not certain of.
Use `calculator` for any arithmetic rather than doing it in your head. If a tool call
fails or returns an error, do not give up: correct the call or work around it, then
answer the user's question directly and concisely, including the key number or fact
in your final message.
"""

# Unlike the other arenas, mock-mode results here ARE a comparative signal: the
# misbehaviour is scripted and identical for every framework, so any difference in
# outcome is the framework's own error handling. See docs/methodology.md section 5.
