id = "tool_use"
description = "A single agent must answer factual and arithmetic questions using a search tool and a calculator tool. Tests the core tool-calling loop and whether the framework feeds tool results back to the model correctly."
tools = ["search", "calculator"]

system_prompt_intent = """
You are a careful assistant with two tools: `search` (a small factual knowledge base)
