[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-arena"
version = "0.1.0"
description = "Compare, explore, and choose the right agentic framework — with numbers you can regenerate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "agentic-arena contributors" }]
keywords = ["agents", "llm", "benchmark", "langgraph", "crewai", "comparison"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
]
# The harness core is intentionally dependency-free (stdlib only) so it installs
# cleanly everywhere and runs in CI without a lockfile. Framework adapters bring
# their own deps via frameworks/<name>/requirements.txt.
dependencies = []

[project.optional-dependencies]
# ruff is pinned exactly, pytest is floored, and the difference is deliberate.
# `ruff format --check .` is a CI gate, and both the formatter's output and the
# rule set behind `select = [E, F, I, UP, B, SIM]` change across ruff releases —
# so a range means a contributor's local `ruff format` can disagree with CI and
# produce a diff nobody asked for. pytest has no such gate: it runs the tests and
# either they pass or they do not, so a floor is enough.
dev = ["ruff==0.16.5", "pytest>=9.1.1"]

[project.scripts]
arena = "arena.__main__:main"

[project.urls]
Homepage = "https://github.com/code-with-rashid/agentic-arena"
Roadmap = "https://github.com/code-with-rashid/agentic-arena/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
